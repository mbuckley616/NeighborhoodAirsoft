name: automerge
# 26 Oct 2026 (Michael in chat: "switch decided work to automerge on green like Old Gates"): a pull request merges the minute
# it is ready, not when Michael taps Approve. Ready means `check`'s gate is green on its head, it merges cleanly, it is not a
# draft, and either it leaves the pipeline alone and has no `hold` label, or Michael approved it: a comment on the PR
# "Approved by Michael: <sha>", which the producer posts when he taps Approve on the control room. scripts/automerge.mjs is
# the rule. It runs from main's copy: when a check run finishes, and every fifteen minutes in case GitHub drops an event.
# Merging to main ships to players: after a merge that changed index.html or js/ it starts `itch` by name, because a merge made
# with the workflow's own token starts no push workflow.
# v1.355 (D.75, two builder lanes): no branch edits the title's version line (two lanes would conflict on it every merge), so
# after any merge this stamps the title on main with the highest version in docs/devlog/ (scripts/tag.mjs stamp), commits that
# with [skip ci], and only then starts itch, so the title still tells Michael which build he is running.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: automerge
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: m
        run: node scripts/automerge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Stamp the title with the highest version in docs/devlog/
        if: steps.m.outputs.merged != '0' && steps.m.outputs.merged != ''
        continue-on-error: true
        run: |
          git fetch origin main && git checkout -B main origin/main
          node scripts/tag.mjs stamp
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Title tag $(node scripts/tag.mjs), the highest in docs/devlog/ [skip ci]" -- index.html
            git push origin main
          fi
      - name: Ship to itch
        if: steps.m.outputs.game == '1'
        run: gh workflow run itch.yml --ref main --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
